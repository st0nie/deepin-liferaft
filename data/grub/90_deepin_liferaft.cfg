# Installed by the deepin-liferaft package.
#
# deepin-liferaft reads memory.pressure (PSI). On kernels built with
# CONFIG_PSI_DEFAULT_DISABLED=y, PSI is disabled at boot and only enabled by
# the psi=1 kernel parameter. Append psi=1 to the default kernel command line
# idempotently, skipping when an administrator has already set it in either
# GRUB_CMDLINE_LINUX or GRUB_CMDLINE_LINUX_DEFAULT. grub-mkconfig sources this
# snippet; the package postinst runs update-grub so it takes effect next boot.
case " ${GRUB_CMDLINE_LINUX_DEFAULT:-} ${GRUB_CMDLINE_LINUX:-} " in
  *" psi=1 "*) : ;;
  *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }psi=1" ;;
esac
